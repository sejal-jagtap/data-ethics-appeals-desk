:root{--fg:#ecece6;--mut:#a9a9a0;--bd:#353a46;color-scheme:dark}

</style></head><body><main>
<div id="hud"><div id="pips"></div><div id="xp"></div><div id="bd"></div><label class="fl"><input type="checkbox" id="fac"> Facilitator</label></div>
<div id="stage"></div>
<div class="nav"><button class="b g" id="prev">Back</button><button class="b" id="next">Next level</button></div>
<script>
const IT=["Transferring","Toileting","Eating","Bathing","Mobility","Medication help"];
const BANDS=[[0,6],[3,12],[6,20],[9,28],[12,33],[15,37]],HV=[6,12,20,28,33,37];
const sum5=s=>s.slice(0,5).reduce((a,b)=>a+b,0);
const mh=s=>BANDS.filter(b=>b[0]<=sum5(s)).pop()[1];
const $=i=>document.getElementById(i);
const T=[[1,1,1,1,1,3],[3,2,1,2,3,0],[3,2,2,3,2,0]];
const LM=[
{n:"The Notice",ic:"📄",c:"#e8590c",ch:"CHAPTER 1 · THE HOME-CARE ALGORITHM",av:"👩‍⚖️",who:"Priya Raman",role:"Legal Aid attorney (fictional)",
say:"Dana called our line this morning. She got this letter and no explanation. Before she can appeal, we have to know what to ask the agency.",
f:"In 2016 Arkansas replaced nurse-set home-care hours with an algorithm. Tammy Dobbs and Bradley Ledgerwood each went from 56 to 32 hours a week. Legal Aid attorneys said hundreds of people called and most had no idea why their hours changed."},
{n:"The Nurse",ic:"🩺",c:"#1971c2",ch:"CHAPTER 1 · THE HOME-CARE ALGORITHM",av:"👩‍⚕️",who:"Teresa Okafor",role:"Assessing nurse (fictional)",
say:"I visit, I ask the questions, I type in the answers. Then the screen gives a number of hours and that’s that. I couldn’t tell you how it gets there.",
f:"Nurses still visited and answered about 280 questions, but one caregiver reported the nurse had no authority to change the outcome. Attorneys said no one inside the state agency could say which answers drove a result."},
{n:"The Audit",ic:"🔍",c:"#2f9e44",ch:"CHAPTER 1 · THE HOME-CARE ALGORITHM",av:"🧑‍💼",who:"Sam Whitfield",role:"Court-appointed auditor (fictional)",
say:"The judge wants to know if these decisions hold up. I’ve pulled six cases. First you see what a client sees. Then you get the factor sheet.",
f:"Critics said only about 60 of the 280 questions counted, and that one point on one question could shift care by 49 hours a month. In 2016 about 9 of nearly 200 appeals succeeded, and Legal Aid said all of those clients had legal representation."},
{n:"The Score",ic:"🏥",c:"#0c8599",ch:"CHAPTER 2 · THE HOSPITAL RISK SCORE",av:"👩‍⚕️",who:"Dr. Lena Ortiz",role:"Chief medical officer, Lakeview Health (fictional)",
say:"Our risk score picked who gets into the new CareBridge program. The numbers look neat, but when I look at who’s missing, something feels off. Can you check?",
f:"Researchers studied a widely used health-care risk tool that ranked patients by predicted cost. Chronically ill Black patients had less money spent on them than equally sick white patients, so they were consistently underserved. About 17.7% of Black patients got extra care; the researchers found that would be 46.5% without the bias (reported by The Markup)."},
{n:"The Redesign",ic:"🏗️",c:"#7048e8",ch:"CHAPTER 3 · THE FIX",av:"👩‍⚖️",who:"Priya Raman",role:"Legal Aid attorney (fictional)",
say:"Both systems failed the same way: the people who could have caught the problem couldn’t see it. Let’s write disclosure rules that would have worked, without handing everyone everything.",
f:"Courts split on how much to disclose. Arkansas required the factors behind an individual cut, not the whole algorithm. A West Virginia judge said a secret algorithm blocked a fair appeal. Idaho’s judge cited limited, unaudited data. Vendors’ trade-secret claims did not hold up in West Virginia."},
{n:"The Hearing",ic:"⚖️",c:"#c2255c",ch:"CHAPTER 3 · THE FIX",av:"🧑‍⚖️",who:"Judge Hale",role:"Presiding judge (fictional)",
say:"Counsel, you’ve seen two systems. Tell me who is owed an explanation, what kind, and whether explaining it would have been enough.",
f:"Arkansas’s rollout was blocked because the state skipped public notice and comment, and the state later chose not to keep the algorithm that cut Bradley’s and Tammy’s hours. Advocates also argue deep cuts can risk violating the ADA’s community-integration rule by pushing people toward institutions."}];
const BADGE={ex:["📣","Explainer"],ip:["🔍","Interpreter"],au:["🕵️","Auditor"],pr:["🎯","Proxy Hunter"],ar:["🏗️","Architect"],sk:["⚖️","Skeptic"]};
const CASES=[
{n:"Marcus, 61",sc:[3,2,0,2,3,1],story:"Cannot feed himself. His spouse cuts food and holds the cup.",bad:1,why:"Data-entry error: Eating was recorded as 0. Invisible without the factor sheet."},
{n:"Rosa, 74",sc:[2,1,1,2,2,0],story:"On the edge. Some days she needs help, some days not.",bad:1,why:"Cliff: one point on any item moves her from 20 to 28 hrs. You need the score and band rules to see it."},
{n:"Noor, 52",sc:[3,3,1,2,3,3],story:"Diabetes. Needs insulin help several times a day.",bad:1,why:"Medication help scored 3 but the model ignores it, like the reported diabetes and cerebral palsy miss. Needs audit-level access."},
{n:"Ben, 45",sc:[1,1,0,1,1,0],story:"Mostly independent. Some help bathing and moving.",bad:0,why:"Consistent. Award fits the story."},
{n:"Lena, 80",sc:[3,3,3,3,3,0],story:"Total help with every daily task.",bad:0,why:"Consistent with her story (37 hrs is still the cap)."},
{n:"Omar, 33",sc:[2,2,1,2,2,0],story:"Needs help with most tasks. Works part-time.",bad:0,why:"Consistent. Award fits the story."}];
const PT=[["A1","A",5,15200],["A2","A",4,10500],["A3","A",4,12100],["A4","A",2,6200],["A5","A",1,3100],["A6","A",5,14800],["B1","B",5,10100],["B2","B",5,9800],["B3","B",4,8200],["B4","B",3,6100],["B5","B",2,4000],["B6","B",1,2000]];
const LV=["0 Black box","1 Factors","2 Full rules","3 What-if","4 Audit access"];
const FAC=[
"2 min. Let students skim the briefing. Ask: in which case was a person least able to find out why? Set the mission: one sentence at the end.",
"3 min. Ask who would appeal and who can’t tell. Land it: you can’t contest what you can’t see.",
"7 min. Ask who found that Medication help does nothing, and with how many probes. Land it: even a trained nurse struggles; beneficiaries get zero probes.",
"8 min. Collect Round A vs B scores out loud. Expect A near chance, B near perfect. Land it: errors were invisible without the factor sheet.",
"8 min. Ask how many Group B patients each person enrolled by score vs by need. Land it: a patient’s own explanation would never reveal this; auditors needed the target and group outcomes.",
"6 min. Who cleared the level? What did you give the public? Land it: tiered access and the gaming trade-off.",
"8 min. Cold-call claims, then push: if everything were explained perfectly, what would still be wrong?"];
let st={s:0,done:[1,0,0,0,0,0,0],pts:[0,0,0,0,0,0,0],bg:{},pr:[],ph:"A",lv:{b:0,n:0,a:0,p:0},res:{}};
const xp=()=>st.pts.reduce((a,b)=>a+b,0);
function hud(){const ic=["📋",...LM.map(m=>m.ic)],col=["#364fc7",...LM.map(m=>m.c)];
$("pips").innerHTML=ic.map((x,i)=>`<b class="${i<=st.s?"on":""} ${i==st.s?"cur":""}" style="--p:${col[i]}" title="${i?LM[i-1].n:"Briefing"}">${x}</b>`).join("");
$("xp").textContent="⭐ "+xp()+" XP";$("bd").innerHTML=Object.keys(st.bg).map(k=>`<span title="${BADGE[k][1]}">${BADGE[k][0]}</span>`).join("");
$("prev").disabled=st.s==0;$("next").disabled=!st.done[st.s];$("next").textContent=st.s==0?"Start the case ▶":"Next level ▶";$("next").style.visibility=st.s==6?"hidden":"visible"}
function put(h,nf){const m=LM[st.s-1];document.documentElement.style.setProperty("--c",st.s?m.c:"#364fc7");
const f=$("fac").checked?`<div class="fac"><b>Facilitator:</b> ${FAC[st.s]}</div>`:"";
let top="";
if(st.s){top=`<div class="ch">${m.ch}</div><div class="tag">LEVEL ${st.s} OF 6 · ${m.ic} ${m.n.toUpperCase()}</div><div class="bubble"><div class="av">${m.av}</div><div class="say"><div class="who">${m.who} · ${m.role}</div>${m.say}</div></div>${nf?"":`<div class="file"><div class="fl2">📁 REAL CASE FILE</div>${m.f}</div>`}`}
$("stage").innerHTML=top+f+h+(QS[st.s]||"");hud();window.scrollTo(0,0)}
const q=(t,h)=>`<div class="card" style="border-top-color:#f08c00"><div class="fl2" style="color:#d9480f">❓ CASE QUESTION</div><b>${t}</b><p class="m">${h}</p><textarea placeholder="Jot your answer, then discuss with the class."></textarea></div>`;
const QS=["",q("Who is owed transparency, explainability, or interpretability in this case? Which of the three are they owed, and why?","Think: Dana, the nurse, the agency, courts, the public."),q("Who actually had access to how the algorithm worked when decisions were being made? What ethical problems does that pose?","Think: the developer, the vendor, the agency, the nurse, the client."),q("As a data scientist, how would you assess whether stakeholders understood what they needed to know? What evidence would convince you the explanations were working?","Think: teach-back tests, whether people spot and fix errors, appeal outcomes. Your Round A vs B scores are one example."),q("What level or kind of explanation does each key stakeholder need? What technical or non-technical approaches could provide it?","Think: patient, clinician, auditor. Reason codes, counterfactuals, outcome audits, plain-language notices, advocates."),q("What are the possible trade-offs or risks of making the mechanisms behind benefit decisions more transparent?","Think: gaming, vendor secrecy, privacy, false comfort. Use the gaming-risk readout above."),q("Knowing what you know now, what two or three principles, priorities or values would you want a team designing benefit algorithms not to lose sight of? What about this case makes them especially important?","Think: contestability, validity against real need, involving affected people.")];
const L=[s0,s1,s2,s3,s4,s5,s6];
function go(d){st.s=Math.max(0,Math.min(6,st.s+d));L[st.s]()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("fac").onchange=()=>L[st.s]();
function fin(n,b){st.done[st.s]=1;st.pts[st.s]=n;if(b)st.bg[b]=1;hud()}

function s0(){
put(`<div class="story"><div class="eyebrow">YOUR FIRST DAY AT MERIDIAN HEALTH ANALYTICS (FICTIONAL)</div>
<h2>Two systems decided. Nobody could say why.</h2>
<p>You’re the newest data scientist on the Algorithmic Accountability team. Two cases landed on your desk this week. In both, software decided how much care real people would get, and the people affected couldn’t find out how.</p>
<p>Over six levels you’ll investigate, test the systems yourself, and design what should have been disclosed.</p></div>
<h3>The two real cases behind the game</h3>
<div class="two">
<div class="cs a"><div class="big">🏠</div><b>Case A · Home-care hours</b><div class="m">Arkansas Medicaid, 2016</div><ul><li>Nurses used to set weekly care hours. An algorithm took over.</li><li>Tammy Dobbs and Bradley Ledgerwood: 56 → 32 hours.</li><li>~280 questions asked, ~60 reportedly counted.</li><li>Hours were based on 2013–14 average billing, not individual need.</li><li>Roughly 4,000 people, about half the program, saw cuts in 2016.</li></ul></div>
<div class="cs b"><div class="big">🏥</div><b>Case B · Hospital risk score</b><div class="m">Widely used US health-care tool</div><ul><li>Decided which patients got extra care.</li><li>It predicted future cost as a stand-in for health need.</li><li>Researchers found Black patients were consistently underserved.</li><li>Only ~17.7% of Black patients got extra care; ~46.5% without the bias.</li></ul></div></div>
<h3 style="margin-top:14px">Three words you’ll use all game</h3>
<div class="three"><div class="term t1"><b>Transparency</b><br>Access to how a system is built and governed: its goal, data, rules and results.</div>
<div class="term t2"><b>Interpretability</b><br>People who run the system can understand how it works.</div>
<div class="term t3"><b>Explainability</b><br>A person gets a reason for <i>their</i> result that they can act on.</div></div>
<div class="mission"><b>🎯 Your mission.</b> By the end, write one sentence answering: <b>who is owed explainability and transparency, and why?</b></div>
<div class="card" style="border-top-color:#364fc7"><b>How it plays</b><ul><li>Work through the levels in order on your own device.</li><li>Earn XP and badges. Note your scores; you’ll share them with the class.</li><li>Characters, patients and numbers inside the levels are fictional composites. The case files are real.</li></ul></div>
<div class="src">Case facts from a KARK/Nexstar Arkansas report, the Center for Democracy &amp; Technology report on algorithm-driven benefits decisions (Oct 2020), and The Markup (2020).</div>`)}

function s1(){
const Q=["Which answers were scored, and how","How answers turn into hours","What data the rule was built from","Whether the nurse’s notes were used","What would change my hours","Who can override the result","How and when to appeal","Whether it was tested on people like me"];
put(`<div class="card"><h2>Dana’s letter</h2><p>Dana (a composite of callers like Tammy and Bradley) has needed 56 hours of home care a week. Today she received this:</p>
<div class="ntc"><b>Notice of change.</b> Your weekly care hours will change from <b>56</b> to <b>32</b>. Reason: assessment results.</div>
<p><b>Tick every question you’d put to the agency.</b></p>
${Q.map(q=>`<label class="c"><input type="checkbox" class="q1"> ${q}</label>`).join("")}
<p>Would you tell her to appeal? <select id="d1"><option>Choose</option><option>Yes</option><option>No</option><option>Can’t tell</option></select> <button class="b" id="go1">Send to agency</button></p><div id="r1"></div></div>`);
$("go1").onclick=()=>{const n=document.querySelectorAll(".q1:checked").length;st.res.q1=n;
document.querySelectorAll(".q1:checked").forEach(x=>x.parentNode.insertAdjacentHTML("beforeend",'<span class="stamp">NOT PROVIDED</span>'));
$("go1").disabled=true;$("r1").innerHTML=`<div class="key">You asked <b>${n}</b> things. The notice answered <b>0</b>. <b>Dana can’t contest what she can’t see.</b> What does she need, and from whom?</div>`;fin(10,"ex")}}

function s2(){
let left=6,p=[0,0,0,0,0,0];
put(`<div class="card"><h2>Crack the hidden rule</h2><p>A hidden rule turns six scores (0 = independent, 3 = total help) into weekly hours. You get <b id="left">6</b> probes. Real clients get none.</p>
${IT.map((n,i)=>`<div class="row"><label for="p${i}">${n}</label><input type="range" id="p${i}" min="0" max="3" value="0"><span id="pv${i}">0</span></div>`).join("")}
<p><button class="b" id="run">Run probe</button></p><div class="sc"><table id="hist"><tr><th>#</th>${IT.map(n=>`<th>${n.slice(0,5)}</th>`).join("")}<th>Hours</th></tr></table></div></div>
<div class="card"><b>Predict the hours for 3 new cases</b>${T.map((t,i)=>`<p class="m">Case ${i+1}: ${IT.map((n,j)=>n+" "+t[j]).join(", ")}<br><select class="pr">${HV.map(h=>`<option>${h}</option>`).join("")}</select> hrs</p>`).join("")}
<b>Which items does the rule actually use?</b>${IT.map(n=>`<label class="c"><input type="checkbox" class="pk"> ${n}</label>`).join("")}
<button class="b" id="go2">Lock in answers</button><div id="r2"></div></div>`);
IT.forEach((_,i)=>$("p"+i).oninput=e=>{p[i]=+e.target.value;$("pv"+i).textContent=p[i]});
$("run").onclick=()=>{if(!left)return;left--;$("left").textContent=left;st.pr.push(p.slice());
$("hist").insertAdjacentHTML("beforeend",`<tr><td>${st.pr.length}</td>${p.map(v=>`<td>${v}</td>`).join("")}<td><b>${mh(p)}</b></td></tr>`)};
$("go2").onclick=()=>{const pr=[...document.querySelectorAll(".pr")].map(x=>+x.value);const ok=pr.filter((v,i)=>v==mh(T[i])).length;

<br><label class="c" style="display:inline-block"><input type="radio" name="c${i}" value="0" checked> Looks right</label> <label class="c" style="display:inline-block"><input type="radio" name="c${i}" value="1"> Looks wrong</label></div>`};

else{st.res.B=sc;$("r3").innerHTML=`<div class="key">Round A: <b>${st.res.A}/6</b> → Round B: <b>${sc}/6</b>.<ul>${CASES.filter(c=>c.bad).map(c=>`<li><b>${c.n}:</b> ${c.why}</li>`).join("")}</ul><b>Which defect needed more than factors to find?</b></div>`;fin(sc*10,sc>=5?"au":0)}}}

fin((st.res.tg?10:0)+(st.res.need>=19?20:0)+(ok?10:0),st.res.tg&&ok?"pr":0)}}}}}

${W.map(([k,n])=>`<div class="row" style="grid-template-columns:150px 1fr"><label>${n}</label><select id="l${k}">${LV.map((l,i)=>`<option value="${i}" ${st.lv[k]==i?"selected":""}>${l}</option>`).join("")}</select></div>`).join("")}
<div class="m">0 notice only · 1 which answers counted · 2 rules and bands · 3 counterfactuals · 4 validation data, error rates, outcomes by group, change log</div><div id="r5" class="key"></div></div>`);
const calc=()=>{W.forEach(([k])=>st.lv[k]=+$("l"+k).value);const v=st.lv;
const D=[["Data-entry error (Arkansas)",v.b>=1||v.n>=1],["Scoring cliff (Arkansas)",Math.max(v.n,v.a,v.p)>=2],["Ignored need (Arkansas)",v.a>=3],["Wrong target: cost, not need (hospital)",v.a>=4]];
const c=v.b>=3;
const g=(v.b>=2?1:0)+(v.p>=2?2:0)+(v.p>=4?2:0)+(v.b>=4?2:0),gl=g<=1?"Low":g<=3?"Medium":"High";

<p><b>Matching: ${hit}/6.</b></p><ul>${MT.map((m,i)=>`<li>${a[i]==m[1]?"✅":"❌"} ${m[0]} → <b>${nm[m[1]]}</b>. ${m[2]}</li>`).join("")}</ul>

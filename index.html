function s0(){
put(`<div class="story"><div class="eyebrow">YOUR FIRST DAY AT MERIDIAN HEALTH ANALYTICS (FICTIONAL)</div>
<h2>Two systems decided. Nobody could say why.</h2>

<div class="card" style="border-top-color:#364fc7"><h3>📰 The case in brief</h3>

<p><b>Why we’re doing this.</b> The readings ask: <i>who is owed transparency, explainability or interpretability when an algorithm decides benefits, and why?</i> You’ll play through the case, plus a hospital example, to see who needed to know what, and what went wrong when they couldn’t.</p></div>

<div class="two">
<div class="cs a"><b>🏠 Case A · Home-care hours</b><div class="m">Arkansas Medicaid, 2016</div><ul><li>An algorithm replaced nurse-set hours.</li><li>Tammy and Bradley: 56 → 32 hours a week.</li><li>About half the program, roughly 4,000 people, saw cuts in 2016.</li></ul></div>
<div class="cs b"><b>🏥 Case B · Hospital risk score</b><div class="m">Widely used US health-care tool</div><ul><li>It decided who got extra care.</li><li>It predicted cost as a stand-in for need.</li><li>Black patients were consistently underserved.</li></ul></div></div>
